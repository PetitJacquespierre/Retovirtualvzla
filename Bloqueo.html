<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reto Virtual VZLA 2026 — Próximamente</title>
<link rel="icon" type="image/webp" href="img/favicon.webp">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;900&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .font-heading { font-family: 'Montserrat', sans-serif; }
        @keyframes pulse-glow {
            0%, 100% { box-shadow: 0 0 20px rgba(0,210,255,0.3); }
            50% { box-shadow: 0 0 60px rgba(0,210,255,0.8); }
        }
        .glow { animation: pulse-glow 2.5s ease-in-out infinite; }
        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
        }
        .float { animation: float 3s ease-in-out infinite; }
    </style>
    <link rel="stylesheet" href="css/wow-effects.css">
</head>
<body class="bg-[#001E50] min-h-screen flex flex-col items-center justify-center px-4 text-white">

    <!-- Logo flotante -->
    <div class="float mb-10">
        <img src="img/RV-Isotipo-sinfondo.webp" alt="Reto Virtual VZLA" class="h-32 w-auto mx-auto"
             style="filter: drop-shadow(0 0 20px rgba(0,210,255,0.6));">
    </div>

    <!-- Texto principal -->
    <div class="text-center mb-12">
        <span class="text-[#00D2FF] font-bold text-[10px] uppercase tracking-[0.5em] mb-4 block">
            🚧 En construcción
        </span>
        <h1 class="font-heading text-5xl md:text-7xl font-black uppercase tracking-tighter leading-tight mb-6">
            ALGO GRANDE <br> <span class="text-[#00D2FF] italic">SE VIENE</span>
        </h1>
        <p class="text-white/50 text-lg max-w-md mx-auto font-light leading-relaxed">
            El circuito de running virtual más exigente de Venezuela está por llegar. Prepárate.
        </p>
    </div>

    <!-- Redes sociales -->
    <div class="flex gap-8 mb-16">
        <a href="https://www.instagram.com/retovirtual.vzla/" target="_blank"
           class="text-white/30 hover:text-[#00D2FF] text-2xl transition-all hover:scale-110">
            <i class="fa-brands fa-instagram"></i>
        </a>
        <a href="https://wa.me/584127732710" target="_blank"
           class="text-white/30 hover:text-[#00D2FF] text-2xl transition-all hover:scale-110">
            <i class="fa-brands fa-whatsapp"></i>
        </a>
        <a href="https://www.strava.com/clubs/1859944" target="_blank"
           class="text-white/30 hover:text-[#00D2FF] text-2xl transition-all hover:scale-110">
            <i class="fa-brands fa-strava"></i>
        </a>
        <a href="https://www.tiktok.com/@retovirtual.vzla" target="_blank" 
           class="text-white/30 hover:text-[#00D2FF] text-2xl transition-all transform hover:scale-110">
            <i class="fa-brands fa-tiktok"></i>
        </a>
    </div>

    <!-- Input clave secreta (invisible hasta click) -->
    <div class="fixed bottom-6 right-6">
        <button onclick="document.getElementById('secret-box').classList.toggle('hidden')"
                class="w-10 h-10 rounded-full bg-white/5 border border-white/10 
                       flex items-center justify-center hover:bg-white/10 transition-all"
                title="Acceso privado">
            <svg class="w-4 h-4 text-white/20" fill="currentColor" viewBox="0 0 20 20">
                <path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-6-3a2 2 0 11-4 0 2 2 0 014 0zm-2 4a5 5 0 00-4.546 2.916A5.986 5.986 0 0010 16a5.986 5.986 0 004.546-2.084A5 5 0 0010 11z" clip-rule="evenodd"></path>
            </svg>
        </button>

        <!-- Caja de clave -->
        <div id="secret-box" class="hidden absolute bottom-14 right-0 bg-[#001840] border border-white/20 
                                     rounded-2xl p-4 shadow-2xl w-56">
            <p class="text-white/50 text-[10px] uppercase tracking-widest mb-3 font-bold">Acceso Preview</p>
            <input id="secret-input" type="password" placeholder="Clave de acceso"
                   class="w-full bg-white/10 border border-white/10 rounded-lg px-3 py-2 text-white 
                          text-sm placeholder-white/20 outline-none focus:border-[#00D2FF]/50 mb-3"
                   onkeypress="if(event.key==='Enter') checkKey()">
            <button onclick="checkKey()"
                    class="w-full bg-[#00D2FF] text-[#001E50] py-2 rounded-lg text-xs font-black 
                           uppercase tracking-widest hover:scale-105 transition-all">
                Entrar
            </button>
            <p id="key-error" class="text-red-400 text-[10px] text-center mt-2 hidden">Clave incorrecta</p>
        </div>
    </div>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <script>
        // ⬇️ CAMBIA ESTA CLAVE POR LA QUE QUIERAS
        var CLAVE_SECRETA = "rvzla2026";

        function checkKey() {
            var input = document.getElementById("secret-input").value;
            if (input === CLAVE_SECRETA) {
                // Redirige a la página real
                window.location.href = "preview.html";
            } else {
                document.getElementById("key-error").classList.remove("hidden");
                document.getElementById("secret-input").value = "";
                setTimeout(function() {
                    document.getElementById("key-error").classList.add("hidden");
                }, 2000);
            }
        }
    </script>
</body>
</html>
